name: Bootstrap v2.5 from tested v2.4 payload

on:
  push:
    branches: [feature/v2.5]
    paths:
      - '.github/workflows/bootstrap-v25.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore validated v2.4 package payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, json, re, shutil, zipfile

          root = Path('.')
          payload_dir = root / 'tools' / 'v240-payload'
          if not payload_dir.exists():
              raise SystemExit('v2.4 payload directory is missing')

          def read(name):
              p = payload_dir / name
              if not p.exists():
                  return None
              return re.sub(r'[^A-Za-z0-9+/=]', '', p.read_text(encoding='ascii'))

          fixed = [read('00.txt')] + [read(f'{i:02d}.txt') for i in range(2, 12)] + [read('13.txt')]
          if any(x is None for x in fixed):
              raise SystemExit('required v2.4 payload chunk is missing')

          part01_candidates = []
          if read('01.txt'):
              part01_candidates.append(('01', read('01.txt')))
          if read('01a.txt') and read('01b.txt'):
              part01_candidates.append(('01a+01b', read('01a.txt') + read('01b.txt')))

          part12_candidates = []
          if read('12.txt'):
              part12_candidates.append(('12', read('12.txt')))
          if read('12.txt') and read('12b.txt'):
              part12_candidates.append(('12+12b', read('12.txt') + read('12b.txt')))

          selected = None
          failures = []
          for name01, part01 in part01_candidates:
              for name12, part12 in part12_candidates:
                  encoded = ''.join([fixed[0], part01, *fixed[1:-1], part12, fixed[-1]])
                  try:
                      payload = base64.b64decode(encoded, validate=False)
                      with zipfile.ZipFile(io.BytesIO(payload)) as z:
                          bad = z.testzip()
                          if bad:
                              raise RuntimeError(f'CRC failure: {bad}')
                          names = set(z.namelist())
                          if 'manifest.json' not in names:
                              raise RuntimeError('manifest missing from payload')
                          manifest = json.loads(z.read('manifest.json').decode('utf-8'))
                          if manifest.get('version') != '2.4.0':
                              raise RuntimeError(f"unexpected version {manifest.get('version')}")
                          if 'cookies' not in manifest.get('permissions', []):
                              raise RuntimeError('cookies permission missing')
                          selected = (payload, name01, name12, manifest)
                          break
                  except Exception as exc:
                      failures.append(f'{name01}/{name12}: {exc}')
              if selected:
                  break

          if not selected:
              raise SystemExit('no valid v2.4 ZIP reconstruction found:\n' + '\n'.join(failures))

          payload, name01, name12, manifest = selected
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              z.extractall(root)

          obsolete = [
              'INSTALL_EDGE.bat', 'PROVIDER_REGISTRY.md', 'SESSION_MANAGER.md',
              'TEST_REPORT.md', 'V2_ROADMAP.md',
              'tests/generic-company-quality.test.js',
              'tests/message-routing-recovery.test.js',
              'tests/v230-safety.test.js',
              '.github/workflows/publish-v240.yml',
              '.github/workflows/publish-v240-final.yml',
              '.github/workflows/bootstrap-v25.yml',
          ]
          for rel in obsolete:
              p = root / rel
              if p.exists():
                  p.unlink()

          if (root / 'tools' / 'v240-payload').exists():
              shutil.rmtree(root / 'tools' / 'v240-payload')
          for rel in ['tools/apply-v240.py', 'tools/apply-v240b.py']:
              p = root / rel
              if p.exists():
                  p.unlink()
          tools = root / 'tools'
          if tools.exists() and not any(tools.iterdir()):
              tools.rmdir()

          print(f"Restored validated v2.4 package via {name01}/{name12}: {manifest['version']}")
          PY

      - name: Syntax and manifest checks
        run: |
          for f in *.js; do node --check "$f"; done
          python -m json.tool manifest.json >/dev/null

      - name: Full regression suite
        run: |
          for f in tests/*.test.js; do echo "== $f =="; node "$f"; done

      - name: Performance and privacy invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.version !== '2.4.0') throw new Error('baseline version mismatch');
          if (!(manifest.permissions || []).includes('cookies')) throw new Error('cookies permission missing');
          const prod = fs.readdirSync('.').filter(x => x.endsWith('.js')).map(x => fs.readFileSync(x, 'utf8')).join('\n');
          if (/setInterval\s*\(/.test(prod)) throw new Error('setInterval forbidden in production');
          if (/characterData\s*:\s*true/.test(prod)) throw new Error('characterData observer forbidden');
          const cookie = fs.readFileSync('cookie-session.js', 'utf8');
          if (/storage\.local\.set/.test(cookie) || /console\.log/.test(cookie)) throw new Error('cookie privacy boundary violated');
          console.log('baseline safety invariants PASS');
          NODE

      - name: Commit verified v2.4 baseline onto feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v2.5): establish verified v2.4 baseline"
          git push origin feature/v2.5
