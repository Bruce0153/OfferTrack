name: Bootstrap v2.5 from tested v2.4 payload

on:
  push:
    branches: [feature/v2.5]
    paths:
      - '.github/workflows/bootstrap-v25.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact v2.4 package payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, json, re, shutil, zipfile

          root = Path('.')
          payload_dir = root / 'tools' / 'v240-payload'
          if not payload_dir.exists():
              raise SystemExit('v2.4 payload directory is missing')

          EXPECTED = {
              '00.txt': '9b657d5944623250108302bd2b73197c204b2eb2d1aaa25beeb9a8994424fd90',
              '02.txt': '5051242929aa09e3a680ea21bbb0e41ccbd1b0f678d5b7f3f82edb5be09d5dfb',
              '03.txt': '79f175c2aa2a4fed4ef9aa93ba4625ff195b4479db23f545cf8025c35c5fc395',
              '04.txt': '2ebaa61fe84235e925221d70ca51c9ead090ed92dbc48e9eac076fd9301e2a16',
              '05.txt': '3f91701e91cded6474fb4bf6aa417f18b7314cdcfb3490255152fd7f5bcb24bf',
              '06.txt': '35d3f8d11a1799065b50247db5103771d4787888863082e904bab9c6a3982578',
              '07.txt': '70ce97d824df639d3ee27798520ea82ae5d5e5ff18428d5281931ab25fe71ea4',
              '08.txt': '1ec0a88f8b44ae0b20dcb88fd88958a427c1bc98a67449d8de7a70c2147c7563',
              '09.txt': 'f7cf46acc8d9ca22f0f138443b6cc17ad1ec07765c56e04cd2a309aa0ea59b21',
              '10.txt': '6128159237f9996296ace10394ad848334317a20767779b858f4d07f1d3ea02b',
              '11.txt': 'cd05ca974410c634de38263099162962493b9ee9e8dc12f3e3c7a6e6640a90e9',
              '13.txt': '13c7715a7e9f066cc3ef210740e1dd1c85ce27dc7517e0c0be2332322865e685',
          }
          CHUNK01_SHA = '7806d80a053776f60a4c21c33a074512033a437d7a70d4aef8392a8541702398'
          FULL12 = '69a452dcd154d2e2cb296d58053e64153d3dbff794bb8e61a354a492f6bc85bd'
          HALF12A = 'e34f0299358fbe8a724de9c537cf64514937fecb56662d48eb0cb1eda7c46b42'
          HALF12B = '798a5273334c8cc62a28efb06d33708057a8443885841d32fe4d49b99b710e6d'
          PAYLOAD_SHA = '152fbd8923435698b5789fe71f043efa37a256871c8346d50b949f42a4fcfe71'

          sha = lambda s: hashlib.sha256(s.encode('ascii')).hexdigest()

          def read(name):
              p = payload_dir / name
              if not p.exists():
                  raise SystemExit(f'missing payload chunk: {name}')
              raw = p.read_text(encoding='ascii')
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              if not cleaned:
                  raise SystemExit(f'empty payload chunk after normalization: {name}')
              return cleaned

          def checked(name):
              data = read(name)
              got = sha(data)
              print(name, 'len=', len(data), 'sha256=', got)
              if got != EXPECTED[name]:
                  raise SystemExit(f'normalized payload hash mismatch: {name}: {got}')
              return data

          parts = [checked('00.txt')]

          if (payload_dir / '01a.txt').exists() and (payload_dir / '01b.txt').exists():
              part01 = read('01a.txt') + read('01b.txt')
          else:
              part01 = read('01.txt')
          if sha(part01) != CHUNK01_SHA:
              raise SystemExit(f'normalized payload hash mismatch: 01: {sha(part01)}')
          parts.append(part01)

          for i in range(2, 12):
              parts.append(checked(f'{i:02d}.txt'))

          raw12 = read('12.txt')
          raw12b = read('12b.txt') if (payload_dir / '12b.txt').exists() else ''
          if sha(raw12) == FULL12:
              parts.append(raw12)
          elif sha(raw12) == HALF12A and raw12b and sha(raw12b) == HALF12B:
              parts.append(raw12 + raw12b)
          else:
              raise SystemExit(f'normalized payload hash mismatch: 12={sha(raw12)} 12b={sha(raw12b) if raw12b else "missing"}')

          parts.append(checked('13.txt'))
          payload = base64.b64decode(''.join(parts), validate=True)
          payload_hash = hashlib.sha256(payload).hexdigest()
          if payload_hash != PAYLOAD_SHA:
              raise SystemExit(f'v2.4 payload SHA256 mismatch: {payload_hash}')

          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'corrupt v2.4 payload member: {bad}')
              z.extractall(root)

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != '2.4.0':
              raise SystemExit(f"expected v2.4.0 payload, got {manifest.get('version')}")
          if 'cookies' not in manifest.get('permissions', []):
              raise SystemExit('restored v2.4 payload does not contain cookies permission')

          obsolete = [
              'INSTALL_EDGE.bat', 'PROVIDER_REGISTRY.md', 'SESSION_MANAGER.md',
              'TEST_REPORT.md', 'V2_ROADMAP.md',
              'tests/generic-company-quality.test.js',
              'tests/message-routing-recovery.test.js',
              'tests/v230-safety.test.js',
              '.github/workflows/publish-v240.yml',
              '.github/workflows/publish-v240-final.yml',
              '.github/workflows/bootstrap-v25.yml',
          ]
          for rel in obsolete:
              p = root / rel
              if p.exists():
                  p.unlink()

          if (root / 'tools' / 'v240-payload').exists():
              shutil.rmtree(root / 'tools' / 'v240-payload')
          for rel in ['tools/apply-v240.py', 'tools/apply-v240b.py']:
              p = root / rel
              if p.exists():
                  p.unlink()
          tools = root / 'tools'
          if tools.exists() and not any(tools.iterdir()):
              tools.rmdir()

          print('Restored tested v2.4 package:', manifest['version'], payload_hash)
          PY

      - name: Syntax and manifest checks
        run: |
          for f in *.js; do node --check "$f"; done
          python -m json.tool manifest.json >/dev/null

      - name: Full regression suite
        run: |
          for f in tests/*.test.js; do echo "== $f =="; node "$f"; done

      - name: Performance and privacy invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.version !== '2.4.0') throw new Error('baseline version mismatch');
          if (!(manifest.permissions || []).includes('cookies')) throw new Error('cookies permission missing');
          const prod = fs.readdirSync('.').filter(x => x.endsWith('.js')).map(x => fs.readFileSync(x, 'utf8')).join('\n');
          if (/setInterval\s*\(/.test(prod)) throw new Error('setInterval forbidden in production');
          if (/characterData\s*:\s*true/.test(prod)) throw new Error('characterData observer forbidden');
          const cookie = fs.readFileSync('cookie-session.js', 'utf8');
          if (/storage\.local\.set/.test(cookie) || /console\.log/.test(cookie)) throw new Error('cookie privacy boundary violated');
          console.log('baseline safety invariants PASS');
          NODE

      - name: Commit verified v2.4 baseline onto feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v2.5): establish verified v2.4 baseline"
          git push origin feature/v2.5
