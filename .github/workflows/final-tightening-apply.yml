name: final tightening apply
on:
  push:
    branches:
      - fix/v2.6.2
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.6.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply missing final tightening only
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def replace_once(p, old, new, required=True):
              s=read(p)
              if new in s: return False
              if old not in s:
                  if required: raise SystemExit(f'migration anchor missing: {p}')
                  return False
              write(p,s.replace(old,new,1)); return True

          # 1) One contract for DOM labels and sensitive URL policy.
          p='application-contract.js'; s=read(p)
          if 'const DOM_LABELS = Object.freeze' not in s:
              anchor="  const STRUCTURED_PATTERNS = Object.freeze({"
              block="""  const DOM_LABELS = Object.freeze({\n    position: Object.freeze(['岗位名称','职位名称','应聘职位','申请职位','岗位','职位']),\n    location: Object.freeze(['工作地点','工作地','意向地点','意向城市','地点','城市']),\n    applyTime: Object.freeze(['投递时间','申请时间','应聘时间','提交时间']),\n    status: Object.freeze(['当前状态','投递状态','申请状态','应聘状态','状态','进度']),\n    company: Object.freeze(['公司','企业','雇主'])\n  });\n\n  const URL_PATTERNS = Object.freeze({\n    sensitiveQuery: /(token|auth|authorization|sign|signature|nonce|timestamp|session|cookie|secret|ticket|share|code|key|credential|candidateid|userid|user_id|openid|unionid|mobile|phone|email)/i,\n    cacheBuster: /^(?:_|t|ts|timestamp|rnd|random|cacheBust|cb)$/i\n  });\n\n"""
              if anchor not in s: raise SystemExit('application contract anchor missing')
              s=s.replace(anchor,block+anchor,1)
          if '    DOM_LABELS,' not in s:
              s=s.replace('    FEISHU_FIELDS,\n','    FEISHU_FIELDS,\n    DOM_LABELS,\n    URL_PATTERNS,\n',1)
          write(p,s)

          # 2) Content DOM field labels consume the same contract.
          p='content.js'; s=read(p)
          if 'const DOM_LABELS = ApplicationContract?.DOM_LABELS;' not in s:
              s=s.replace("  const ApplicationContract = globalThis.OfferTrackApplicationContract;\n", "  const ApplicationContract = globalThis.OfferTrackApplicationContract;\n  const DOM_LABELS = ApplicationContract?.DOM_LABELS;\n  if (!DOM_LABELS) throw new Error('OfferTrack application contract is required');\n",1)
              s=s.replace("""  const FIELD_LABELS = [\n    '岗位名称','职位名称','应聘职位','申请职位','岗位','职位',\n    '工作地点','工作地','意向地点','意向城市','地点','城市',\n    '投递时间','申请时间','应聘时间','提交时间',\n    '当前状态','投递状态','申请状态','应聘状态','状态','进度',\n    '公司','企业','雇主','招聘类型','项目'\n  ];""", """  const FIELD_LABELS = [\n    ...DOM_LABELS.position,\n    ...DOM_LABELS.location,\n    ...DOM_LABELS.applyTime,\n    ...DOM_LABELS.status,\n    ...DOM_LABELS.company,\n    '招聘类型','项目'\n  ];""",1)
              pairs={
                "['岗位名称','职位名称','应聘职位','申请职位','岗位','职位']":'DOM_LABELS.position',
                "['公司','企业','雇主']":'DOM_LABELS.company',
                "['工作地点','工作地','意向地点','意向城市','地点','城市']":'DOM_LABELS.location',
                "['投递时间','申请时间','应聘时间','提交时间']":'DOM_LABELS.applyTime',
                "['当前状态','投递状态','申请状态','应聘状态','状态','进度']":'DOM_LABELS.status'
              }
              for old,new in pairs.items(): s=s.replace(old,new)
              write(p,s)

          # 3) Safe GET URL policy also consumes the central contract.
          p='followup-strategy.js'; s=read(p)
          if 'Contract.URL_PATTERNS.sensitiveQuery' not in s:
              s=s.replace("""  const matcher = root?.OfferTrackApplicationMatcher\n    || (typeof module !== 'undefined' && module.exports ? require('./application-matcher.js') : null);\n  const api = factory(matcher);""", """  const matcher = root?.OfferTrackApplicationMatcher\n    || (typeof module !== 'undefined' && module.exports ? require('./application-matcher.js') : null);\n  const contract = root?.OfferTrackApplicationContract\n    || (typeof module !== 'undefined' && module.exports ? require('./application-contract.js') : null);\n  const api = factory(matcher, contract);""",1)
              s=s.replace("function(Matcher) {\n  'use strict';", "function(Matcher, Contract) {\n  'use strict';\n\n  if (!Contract?.URL_PATTERNS) throw new Error('OfferTrack application contract is required');",1)
              s=s.replace("  const SENSITIVE_QUERY_RE = /(token|auth|authorization|sign|signature|nonce|timestamp|session|cookie|secret|ticket|share|code|key|credential|candidateid|userid|user_id|openid|unionid|mobile|phone|email)/i;\n  const CACHE_BUSTER_RE = /^(?:_|t|ts|timestamp|rnd|random|cacheBust|cb)$/i;", "  const SENSITIVE_QUERY_RE = Contract.URL_PATTERNS.sensitiveQuery;\n  const CACHE_BUSTER_RE = Contract.URL_PATTERNS.cacheBuster;",1)
              write(p,s)

          # 4) Resource Timing URL is sanitized before leaving the page.
          p='strategy-probe.js'; s=read(p)
          if 'function safeResourceUrl' not in s:
              s=s.replace("  const Contract = globalThis.OfferTrackApplicationContract;\n", "  const Contract = globalThis.OfferTrackApplicationContract;\n  const URL_POLICY = Contract?.URL_PATTERNS;\n",1)
              anchor='  function collectResources() {'
              block="""  function safeResourceUrl(value) {\n    if (!URL_POLICY) return '';\n    let u;\n    try { u = new URL(String(value || ''), location.href); } catch { return ''; }\n    if (u.protocol !== 'https:' || u.origin !== location.origin) return '';\n    for (const [key, val] of [...u.searchParams.entries()]) {\n      if (URL_POLICY.sensitiveQuery.test(key) || URL_POLICY.sensitiveQuery.test(val) || String(val).length > 96) return '';\n      if (URL_POLICY.cacheBuster.test(key)) u.searchParams.delete(key);\n    }\n    u.hash = '';\n    return u.toString();\n  }\n\n"""
              if anchor not in s: raise SystemExit('strategy probe anchor missing')
              s=s.replace(anchor,block+anchor,1)
              old="""      let u;\n      try { u=new URL(raw,location.href); } catch { continue; }\n      if (u.protocol!=='https:' || u.origin!==location.origin) continue;\n      const key=`${u.pathname}${u.search}`;\n      if (!API_HINT_RE.test(key) || API_BAD_RE.test(key)) continue;\n      seen.add(raw);\n      out.push({ url:u.toString(), initiatorType:String(e?.initiatorType||''), duration:Number(e?.duration||0) });"""
              new="""      const safeUrl = safeResourceUrl(raw);\n      if (!safeUrl) continue;\n      const u = new URL(safeUrl);\n      const key=`${u.pathname}${u.search}`;\n      if (!API_HINT_RE.test(key) || API_BAD_RE.test(key)) continue;\n      seen.add(raw);\n      out.push({ url:safeUrl, initiatorType:String(e?.initiatorType||''), duration:Number(e?.duration||0) });"""
              if old not in s: raise SystemExit('resource timing anchor missing')
              write(p,s.replace(old,new,1))

          # 5) Permission result is not persisted in page/sync payload; remove dead popup row.
          p='popup.js'; s=read(p)
          if 'persistentHostAccess' in s:
              old="""    const tab = await activeTab();\n    let persistentHostAccess = false;\n    if (tab?.url && /^https:/i.test(tab.url)) {\n      persistentHostAccess = await HostAccess?.request?.(tab.url).catch(() => false) || false;\n    }\n    const res = await chrome.runtime.sendMessage({\n      type: 'SYNC_RECORDS', records: currentRecords, page: { ...currentPage, persistentHostAccess }, source: 'manual'\n    });"""
              new="""    const permissionUrl = /^https:/i.test(String(currentPage?.url || '')) ? currentPage.url : '';\n    if (permissionUrl) await HostAccess?.request?.(permissionUrl).catch(() => false);\n    const res = await chrome.runtime.sendMessage({\n      type: 'SYNC_RECORDS', records: currentRecords, page: currentPage, source: 'manual'\n    });"""
              if old not in s: raise SystemExit('popup permission anchor missing')
              write(p,s.replace(old,new,1))
          p='popup.html'; s=read(p)
          s=s.replace('      <small id="sessionMeta" class="session-meta">会话状态读取中…</small>\n','')
          write(p,s)

          # 6) Explicit secret clearing; no plaintext refill.
          p='options.js'; s=read(p)
          if 'function clearAppSecret' not in s:
              s=s.replace("  $('save').onclick = save;\n", "  $('save').onclick = save;\n  $('clearAppSecret').onclick = clearAppSecret;\n",1)
              anchor='async function parseUrl() {'
              block="""async function clearAppSecret() {\n  await Credentials?.clear?.();\n  $('appSecret').value = '';\n  $('rememberAppSecret').checked = false;\n  $('appSecret').placeholder = '默认仅本次浏览器会话保存';\n  setStatus('✓ App Secret 已从浏览器会话和本机持久化存储中清除');\n}\n\n"""
              if anchor not in s: raise SystemExit('options secret anchor missing')
              write(p,s.replace(anchor,block+anchor,1))
          p='options.html'; s=read(p)
          if 'id="clearAppSecret"' not in s:
              old='<p class="hint">App Secret 默认保存在浏览器会话内存中，浏览器重启后需重新输入；开启“记住”后才会写入本机扩展私有存储。无论哪种方式都不会发送到招聘网站、飞书表格或日志。</p>'
              new='<div class="buttons"><button id="clearAppSecret" class="danger">清除已保存密钥</button></div>\n      <p class="hint">App Secret 默认保存在浏览器会话内存中，浏览器重启后需重新输入；开启“记住”后才会写入本机扩展私有存储。设置对象本身永远不包含 App Secret，也不会把密钥回填到页面、飞书表格或日志。</p>'
              if old not in s: raise SystemExit('options html secret anchor missing')
              write(p,s.replace(old,new,1))

          # 7) Docs only describe the final behavior.
          p='README.md'; s=read(p)
          s=s.replace('普通 `settings` 对象不再保存 App Secret。','普通 `settings` 对象不再保存 App Secret，设置页不会回填明文，并可随时用“清除已保存密钥”同时删除会话与本机副本。',1)
          s=s.replace('这些情况下只更新检查相关字段或等待用户处理.','这些情况下不会为了记录诊断而写入飞书业务表；Session / Journal / 运行摘要会保留必要的非敏感诊断信息，并在需要时等待用户处理。',1)
          s=s.replace('这些情况下只更新检查相关字段或等待用户处理。','这些情况下不会为了记录诊断而写入飞书业务表；Session / Journal / 运行摘要会保留必要的非敏感诊断信息，并在需要时等待用户处理。',1)
          write(p,s)
          p='QUICK_START.txt'; s=read(p)
          old='8. App Secret 默认仅保留在当前浏览器会话；需要浏览器重启后仍自动跟进时，再勾选“在本机记住 App Secret”。'
          new=old+'设置页不会回填明文，需要时可直接点击“清除已保存密钥”。'
          if old in s and new not in s: s=s.replace(old,new,1)
          write(p,s)
          p='CHANGELOG.md'; s=read(p)
          if '显式“清除已保存密钥”' not in s:
              s=s.replace('- App Secret 从普通 `settings` 中移除，默认只放在 `chrome.storage.session`；只有用户显式勾选“在本机记住”才写入独立的可信扩展本地凭据区。旧 `settings.appSecret` 更新后只迁移到当前会话并从普通设置删除。\n', '- App Secret 从普通 `settings` 中移除，默认只放在 `chrome.storage.session`；只有用户显式勾选“在本机记住”才写入独立的可信扩展本地凭据区。旧 `settings.appSecret` 更新后只迁移到当前会话并从普通设置删除。\n- 设置页不再回填 App Secret 明文，并提供显式“清除已保存密钥”；可一次清除会话与本机持久化副本。\n',1)
          if 'Resource Timing 中发现的 API URL' not in s:
              s=s.replace('- Structured State 收紧：script JSON 在离开页面前先做安全投影；MAIN-world Store 使用字段/路径联合白名单、敏感 key/container 黑名单和更小预算；泛化 `id/status/name/time` 只有处于招聘申请上下文时才允许保留。\n', '- Structured State 收紧：script JSON 在离开页面前先做安全投影；MAIN-world Store 使用字段/路径联合白名单、敏感 key/container 黑名单和更小预算；泛化 `id/status/name/time` 只有处于招聘申请上下文时才允许保留。\n- 页面字段标签与 Structured State 字段语义进一步集中到 `application-contract.js`；Resource Timing 中发现的 API URL 在离开页面前先拒绝敏感 query，并清理 cache-buster，避免候选 URL 携带账号/签名参数进入后台。\n',1)
          write(p,s)

          # 8) Add regression assertions without replacing existing stronger tests.
          p='tests/application-contract.test.js'; s=read(p)
          marker="assert(Array.isArray(Contract.DOM_LABELS.position)"
          if marker not in s:
              block="""assert(Array.isArray(Contract.DOM_LABELS.position) && Contract.DOM_LABELS.position.includes('岗位名称'));\nassert(Contract.URL_PATTERNS.sensitiveQuery.test('candidateId'));\nassert.strictEqual(Contract.fieldKind('id', 'root.user.profile.id'), '', 'generic personal id must be rejected');\n"""
              s=s.replace("console.log('application contract + safe structured projection: PASS');",block+"\nconsole.log('application contract + safe structured projection: PASS');",1)
              write(p,s)
          p='tests/final-hardening.test.js'; s=read(p)
          if "dead popup session placeholder" not in s:
              block="""const popupHtml = read('popup.html');\nconst popup = read('popup.js');\nassert(!popupHtml.includes('sessionMeta'), 'dead popup session placeholder must be removed');\nassert(!popup.includes('persistentHostAccess }, source'), 'permission result must not be persisted into sync page payload');\nassert(options.includes('clearAppSecret'), 'user must be able to explicitly clear the secret');\nassert(probe.includes('safeResourceUrl'), 'resource timing URLs must be sanitized before crossing extension boundary');\n"""
              s=s.replace("console.log('final privacy / permissions / architecture hardening: PASS');",block+"\nconsole.log('final privacy / permissions / architecture hardening: PASS');",1)
              write(p,s)

          # Fail closed if any target state is missing.
          checks={
            'application-contract.js':['DOM_LABELS','URL_PATTERNS'],
            'content.js':['DOM_LABELS.position','DOM_LABELS.status'],
            'followup-strategy.js':['Contract.URL_PATTERNS.sensitiveQuery'],
            'strategy-probe.js':['safeResourceUrl'],
            'options.js':['clearAppSecret'],
            'options.html':['id="clearAppSecret"']
          }
          for p,needles in checks.items():
              s=read(p)
              for n in needles:
                  if n not in s: raise SystemExit(f'final state missing: {p}: {n}')
          if 'sessionMeta' in read('popup.html'): raise SystemExit('dead sessionMeta remains')
          if 'persistentHostAccess }, source' in read('popup.js'): raise SystemExit('permission result still persisted')
          PY
      - name: Validate complete suite
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          python -m json.tool manifest.json >/dev/null
          for f in tests/*.test.js; do echo "== $f =="; node "$f"; done
      - name: Commit verified delta
        run: |
          set -euo pipefail
          git config user.name 'Zeng, Hualong'
          git config user.email '140960050+Bruce0153@users.noreply.github.com'
          git add application-contract.js content.js followup-strategy.js strategy-probe.js popup.js popup.html options.js options.html README.md QUICK_START.txt CHANGELOG.md tests/application-contract.test.js tests/final-hardening.test.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: finish v2.6.2 hardening'
            git push origin HEAD:fix/v2.6.2
          fi
