name: final v2.6.2 apply

on:
  push:
    branches:
      - fix/v2.6.2
    paths:
      - '.sync/final-v262.part*'
      - '.github/workflows/final-v262-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.6.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply final tightening
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .sync/final-v262.part00 \
            .sync/final-v262.part01 \
            .sync/final-v262.part02 \
            .sync/final-v262.part03 \
            .sync/final-v262.part04_05 \
            .sync/final-v262.part06_07 \
            .sync/final-v262.part08_09 \
            .sync/final-v262.part10_11 > /tmp/final.patch.b64
          test "$(wc -c < /tmp/final.patch.b64)" -eq 47276
          base64 -d /tmp/final.patch.b64 > /tmp/final.patch.gz
          echo "4b04417f4512176ce9056e2be6afee7465a64a6170473fe9a1edc6fcc91568ae  /tmp/final.patch.gz" | sha256sum -c -
          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          git apply --check /tmp/final.patch
          git apply /tmp/final.patch
          rm -rf .sync
          for f in ./*.js; do node --check "$f"; done
          node tests/application-contract.test.js
          node tests/credential-store.test.js
          node tests/host-access.test.js
          node tests/followup-decision.test.js
          node tests/final-hardening.test.js
      - name: Commit verified final tightening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zeng, Hualong"
          git config user.email "140960050+Bruce0153@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v2.6.2): final security and architecture tightening"
          git push origin HEAD:fix/v2.6.2
