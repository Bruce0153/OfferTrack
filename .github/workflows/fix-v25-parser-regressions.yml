name: Fix v2.5 parser regressions

on:
  push:
    branches: [feature/v2.5]
    paths:
      - '.github/workflows/fix-v25-parser-regressions.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply parser fix
        run: python tools/fix-v25-parser-regressions.py
      - name: Verify parser fix
        shell: bash
        run: |
          node --check semantic.js
          node tests/semantic-regressions-v25.test.js
          for f in tests/*.test.js; do node "$f" >/dev/null; done
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "OfferTrack CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-v25-parser-regressions.yml tools/fix-v25-parser-regressions.py
          git add semantic.js tests/semantic-regressions-v25.test.js
          git commit -m "fix(v2.5): correct timeline status and account profile company noise"
          git push origin HEAD:feature/v2.5
