name: OfferTrack v2.2.1 hotfix

on:
  push:
    branches: [v2]
    paths:
      - tools/apply_v221_hotfix.py
      - tools/prepare_v221_hotfix.py
      - .github/workflows/hotfix-v221.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare repository UI
        run: python tools/prepare_v221_hotfix.py
      - name: Apply performance hotfix
        run: python tools/apply_v221_hotfix.py
      - name: Syntax and regression tests
        run: |
          for f in *.js; do node --check "$f"; done
          for t in tests/*.test.js; do node "$t"; done
          python -m json.tool manifest.json >/dev/null
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_v221_hotfix.py tools/prepare_v221_hotfix.py .github/workflows/hotfix-v221.yml
          git add -A
          git commit -m "fix(v2.2.1): stop observer feedback loops and bound page scans"
          git push origin v2
