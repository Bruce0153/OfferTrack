name: OfferTrack v2.3.1 generic stability hotfix

on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/hotfix-v231.yml'

permissions:
  contents: write

jobs:
  apply-v231:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply generic v2.3.1 updater
        run: python tools/apply-v231.py
      - name: Keep new regression tests fully generic
        run: |
          cat > tests/message-routing-recovery.test.js <<'JS'
          const fs = require('fs');
          const path = require('path');
          const assert = require('assert');
          const root = path.join(__dirname, '..');
          const bg = fs.readFileSync(path.join(root, 'background.js'), 'utf8');
          const popup = fs.readFileSync(path.join(root, 'popup.js'), 'utf8');
          const follow = fs.readFileSync(path.join(root, 'followup-background.js'), 'utf8');
          const content = fs.readFileSync(path.join(root, 'content.js'), 'utf8');
          assert(bg.includes('BACKGROUND_MESSAGE_TYPES'));
          assert(!bg.includes("error: 'unknown_message'"));
          assert(popup.includes('ensurePageBridge') && popup.includes('sendPageMessage'));
          assert(follow.includes('injectPageBridge') && follow.includes('sendTabMessage'));
          assert(content.includes('COMPANY_NOISE_RE') && content.includes('COMPANY_KEY_RE') && content.includes('APP_ROUTE_RE'));
          assert(content.includes('runtime-json') && content.includes('data-company-name'));
          console.log('message routing and generic recovery PASS');
          JS
      - name: Syntax checks
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Full regression suite
        run: |
          for f in tests/*.test.js; do echo "== $f =="; node "$f"; done
      - name: Safety invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.version !== '2.3.1') throw new Error('version mismatch');
          if ((m.permissions || []).includes('cookies')) throw new Error('cookies permission forbidden');
          const c = fs.readFileSync('content.js','utf8');
          const s = fs.readFileSync('semantic.js','utf8');
          if (!c.includes('AUTO_SCAN_MIN_GAP = 4000')) throw new Error('performance throttle lost');
          if (s.includes('setInterval(')) throw new Error('semantic polling forbidden');
          if (fs.existsSync('content-ui.js')) throw new Error('deprecated content-ui.js returned');
          if (!c.includes('COMPANY_CONTEXT_BAD_RE') || !s.includes('companyCandidateVariants')) throw new Error('generic company evidence guards missing');
          console.log('v2.3.1 safety invariants PASS');
          NODE
      - name: Commit v2.3.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-v231.py .github/workflows/hotfix-v231.yml
          git add -A
          git commit -m "fix(v2.3.1): recover page bridge and harden generic company inference"
          git push origin v2
