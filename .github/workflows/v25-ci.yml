name: OfferTrack v2.5 CI

on:
  push:
    branches:
      - feature/v2.5
  pull_request:
    branches:
      - v2

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and manifest validation
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          python -m json.tool manifest.json >/dev/null
          node - <<'NODE'
          const m = require('./manifest.json');
          if (m.manifest_version !== 3) throw new Error('Manifest V3 required');
          if (m.version !== '2.5.0' || m.version_name !== '2.5.0') throw new Error('v2.5.0 version mismatch');
          if (!(m.permissions || []).includes('cookies')) throw new Error('cookies permission missing');
          NODE

      - name: Full regression suite
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do
            echo "== $f =="
            node "$f"
          done

      - name: Performance and privacy safety
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prod = fs.readdirSync('.')
            .filter(x => x.endsWith('.js'))
            .map(x => fs.readFileSync(x, 'utf8'))
            .join('\n');

          if (/setInterval\s*\(/.test(prod)) throw new Error('setInterval forbidden in production root JS');
          if (/characterData\s*:\s*true/.test(prod)) throw new Error('characterData:true observer forbidden');

          const content = fs.readFileSync('content.js', 'utf8');
          if (!/AUTO_SCAN_MIN_GAP\s*=\s*4000/.test(content)) throw new Error('AUTO_SCAN_MIN_GAP safety guard missing');
          if (!/scanPromise/.test(content)) throw new Error('scanPromise concurrency guard missing');
          for (const event of ['hashchange','popstate','pageshow','visibilitychange']) {
            if (!content.includes(event)) throw new Error(`event-driven route signal missing: ${event}`);
          }

          const cookie = fs.readFileSync('cookie-session.js', 'utf8');
          if (/storage\.local\.set/.test(cookie)) throw new Error('cookie module must not persist values/evidence directly');
          if (/console\.(?:log|info|debug|warn|error)/.test(cookie)) throw new Error('cookie module must not log cookie data');

          const journal = fs.readFileSync('change-journal.js', 'utf8');
          for (const forbidden of ['responseBody','response_body']) {
            if (journal.includes(forbidden)) throw new Error(`journal forbidden field found: ${forbidden}`);
          }

          const matcher = require('./application-matcher.js');
          if (matcher.AUTO_UPDATE_MIN_CONFIDENCE < 0.85) throw new Error('application auto-update threshold too low');
          const queue = require('./followup-queue.js');
          if (queue.MAX_RETRIES > 4) throw new Error('retry budget too high');

          const obsolete = ['PROVIDER_REGISTRY.md','SESSION_MANAGER.md','TEST_REPORT.md','V2_ROADMAP.md','INSTALL_EDGE.bat'];
          for (const f of obsolete) if (fs.existsSync(f)) throw new Error(`obsolete release file remains: ${f}`);

          if (fs.existsSync('tools/v240-payload') || fs.existsSync('tools/apply-v240.py') || fs.existsSync('tools/apply-v240b.py')) {
            throw new Error('legacy v2.4 payload publisher remains');
          }
          console.log('OfferTrack v2.5 performance/privacy safety: PASS');
          NODE

      - name: Build Edge ZIP
        run: |
          set -euo pipefail
          ZIP="OfferTrack_Edge_v2.5.0.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'tests/*' \
            -x '*.zip'
          unzip -t "$ZIP" >/dev/null
          unzip -p "$ZIP" manifest.json | python -m json.tool >/dev/null
          test "$(unzip -p "$ZIP" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "2.5.0"

      - name: Upload Edge ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OfferTrack-v2.5.0
          path: OfferTrack_Edge_v2.5.0.zip
          if-no-files-found: error
          retention-days: 30
