name: Harden v2.6 follow-up runtime

on:
  push:
    branches: [feature/v2.6]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'chore(v2.6): trigger follow-up runtime hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.6
          fetch-depth: 0
      - name: Apply bounded follow-up hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('followup-background.js')
          s=p.read_text()
          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing transform anchor: {label}')
              s=s.replace(old,new,1)

          once("  const Sessions = globalThis.OfferTrackSessionManager;\n",
               "  const Sessions = globalThis.OfferTrackSessionManager;\n  const CookieSession = globalThis.OfferTrackCookieSession;\n",
               'cookie import')
          once("      followUpApiFirst: input.followUpApiFirst !== false,\n",
               "      followUpApiFirst: input.followUpApiFirst !== false,\n      followUpCookiePreflight: input.followUpCookiePreflight !== false,\n",
               'cookie config')
          once("    const targets = Core.selectTargets(existing, cfg);\n    const rawGroups = Core.groupTargets(targets);\n    const allGroups = Providers?.enrichGroups ? Providers.enrichGroups(rawGroups, Core) : rawGroups;\n",
               "    const targets = Core.selectTargets(existing, cfg);\n    const rawGroups = Core.groupTargets(targets);\n    const allGroups = Providers?.enrichGroups ? Providers.enrichGroups(rawGroups, Core) : rawGroups;\n    await Sessions?.retainHosts?.(allGroups.map(group => group.host)).catch(() => null);\n",
               'session retain')
          once("      const sessionEvent = Sessions?.record ? await Sessions.record(group, inspected, source).catch(() => null) : null;\n",
               "      const sessionEvent = Sessions?.record ? await Sessions.record(group, { ...inspected, cookieEvidence: group._cookieEvidence || null }, source).catch(() => null) : null;\n",
               'session evidence')
          once("  async function inspectGroup(group, cfg, source = 'manual') {\n    let tab = await findBestOpenTab(group);\n    const sessionDecision = Sessions?.shouldSkip ? await Sessions.shouldSkip(group, { source, hasOpenTab: !!tab }).catch(() => ({ skip: false })) : { skip: false };\n",
               "  async function inspectGroup(group, cfg, source = 'manual') {\n    const cookieEvidence = cfg.followUpCookiePreflight && CookieSession?.inspectGroup\n      ? await CookieSession.inspectGroup(group).catch(() => ({ available: false, level: 'unavailable', checkedAt: Date.now() }))\n      : { available: false, level: 'unavailable', checkedAt: Date.now() };\n    group._cookieEvidence = cookieEvidence;\n    let tab = await findBestOpenTab(group);\n    const sessionDecision = Sessions?.shouldSkip ? await Sessions.shouldSkip(group, { source, hasOpenTab: !!tab, cookieEvidence }).catch(() => ({ skip: false })) : { skip: false };\n",
               'cookie preflight')
          once("      files: ['semantic.js', 'content.js', 'strategy-probe.js', 'followup-probe.js'],\n",
               "      files: ['company-identity.js', 'semantic.js', 'content.js', 'strategy-probe.js', 'followup-probe.js'],\n",
               'company bridge')
          once("    const tabs = await chrome.tabs.query({}).catch(() => []);\n",
               "    const tabs = await chrome.tabs.query({ url: ['https://*/*'] }).catch(() => []);\n",
               'scoped tab query')
          s=s.replace("configure().catch(console.warn)", "configure().catch(() => {})")
          s=s.replace("run('manual').catch(err => console.error('[OfferTrack follow-up manual]', err))", "run('manual').catch(() => {})")
          s=s.replace("run('alarm').catch(err => console.error('[OfferTrack follow-up]', err))", "run('alarm').catch(() => {})")
          p.write_text(s)
          PY
          node --check followup-background.js
          ! grep -R "chrome\.tabs\.query({})" --include='*.js' .
          ! grep -R "console\.\(log\|info\|debug\|warn\|error\)" --include='*.js' --exclude-dir=tests .
          grep -q "CookieSession.inspectGroup" followup-background.js
          grep -q "company-identity.js.*semantic.js" followup-background.js
      - name: Commit clean runtime and remove one-shot workflow
        run: |
          rm -f .github/workflows/v26-followup-hardening.yml
          git config user.name 'Zeng, Hualong'
          git config user.email '140960050+Bruce0153@users.noreply.github.com'
          git add followup-background.js .github/workflows/v26-followup-hardening.yml
          git commit -m 'fix(v2.6): harden four-level follow-up runtime'
          git push origin HEAD:feature/v2.6
