name: v26-hardening-once
on: [push]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.6
          fetch-depth: 0
      - name: Patch runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('followup-background.js')
          s=p.read_text()
          changes=[
            ("  const Sessions = globalThis.OfferTrackSessionManager;\n", "  const Sessions = globalThis.OfferTrackSessionManager;\n  const CookieSession = globalThis.OfferTrackCookieSession;\n"),
            ("      followUpApiFirst: input.followUpApiFirst !== false,\n", "      followUpApiFirst: input.followUpApiFirst !== false,\n      followUpCookiePreflight: input.followUpCookiePreflight !== false,\n"),
            ("    const allGroups = Providers?.enrichGroups ? Providers.enrichGroups(rawGroups, Core) : rawGroups;\n", "    const allGroups = Providers?.enrichGroups ? Providers.enrichGroups(rawGroups, Core) : rawGroups;\n    await Sessions?.retainHosts?.(allGroups.map(group => group.host)).catch(() => null);\n"),
            ("      const sessionEvent = Sessions?.record ? await Sessions.record(group, inspected, source).catch(() => null) : null;\n", "      const sessionEvent = Sessions?.record ? await Sessions.record(group, { ...inspected, cookieEvidence: group._cookieEvidence || null }, source).catch(() => null) : null;\n"),
            ("  async function inspectGroup(group, cfg, source = 'manual') {\n    let tab = await findBestOpenTab(group);\n    const sessionDecision = Sessions?.shouldSkip ? await Sessions.shouldSkip(group, { source, hasOpenTab: !!tab }).catch(() => ({ skip: false })) : { skip: false };\n", "  async function inspectGroup(group, cfg, source = 'manual') {\n    const cookieEvidence = cfg.followUpCookiePreflight && CookieSession?.inspectGroup\n      ? await CookieSession.inspectGroup(group).catch(() => ({ available: false, level: 'unavailable', checkedAt: Date.now() }))\n      : { available: false, level: 'unavailable', checkedAt: Date.now() };\n    group._cookieEvidence = cookieEvidence;\n    let tab = await findBestOpenTab(group);\n    const sessionDecision = Sessions?.shouldSkip ? await Sessions.shouldSkip(group, { source, hasOpenTab: !!tab, cookieEvidence }).catch(() => ({ skip: false })) : { skip: false };\n"),
            ("      files: ['semantic.js', 'content.js', 'strategy-probe.js', 'followup-probe.js'],\n", "      files: ['company-identity.js', 'semantic.js', 'content.js', 'strategy-probe.js', 'followup-probe.js'],\n"),
            ("    const tabs = await chrome.tabs.query({}).catch(() => []);\n", "    const tabs = await chrome.tabs.query({ url: ['https://*/*'] }).catch(() => []);\n")
          ]
          for old,new in changes:
              if old not in s:
                  raise SystemExit('missing anchor: '+old[:80])
              s=s.replace(old,new,1)
          s=s.replace('configure().catch(console.warn)', 'configure().catch(() => {})')
          s=s.replace("run('manual').catch(err => console.error('[OfferTrack follow-up manual]', err))", "run('manual').catch(() => {})")
          s=s.replace("run('alarm').catch(err => console.error('[OfferTrack follow-up]', err))", "run('alarm').catch(() => {})")
          p.write_text(s)
          PY
          node --check followup-background.js
          grep -q 'CookieSession.inspectGroup' followup-background.js
          grep -q "company-identity.js', 'semantic.js" followup-background.js
          if grep -q 'chrome.tabs.query({})' followup-background.js; then exit 1; fi
      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v26-hardening-run.yml .github/workflows/v26-followup-hardening.yml
          git config user.name 'Zeng, Hualong'
          git config user.email '140960050+Bruce0153@users.noreply.github.com'
          git add followup-background.js .github/workflows
          git commit -m 'fix(v2.6): harden four-level follow-up runtime'
          git push origin HEAD:feature/v2.6
