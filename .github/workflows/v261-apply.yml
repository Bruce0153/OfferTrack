# final source-only apply; workflow files are managed by the GitHub connector
name: v261-apply-once

on:
  push:
    branches:
      - fix/v2.6.1
    paths:
      - '.github/workflows/v261-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.6.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify source patch
        run: |
          set -euo pipefail
          cat .sync/v261-part0.txt .sync/v261-part1.txt .sync/v261-part2.txt .sync/v261-part3.txt | base64 -d > /tmp/v261.patch.xz
          echo '5a6bad79bf80dd05df82344704e5e8efedeea027edc408483497e3e872e11df3  /tmp/v261.patch.xz' | sha256sum -c -
          xz -dc /tmp/v261.patch.xz > /tmp/v261.patch
          git apply --check --exclude=tests/v26-lite-runtime.test.js --exclude=.github/workflows/v26-ci.yml /tmp/v261.patch
          git apply --exclude=tests/v26-lite-runtime.test.js --exclude=.github/workflows/v26-ci.yml /tmp/v261.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v26-lite-runtime.test.js')
          s=p.read_text()
          s=s.replace("assert.strictEqual(manifest.version, '2.6.0');", "assert.strictEqual(manifest.version, '2.6.1');")
          s=s.replace("console.log('v2.6 lightweight runtime regression: PASS');", "console.log('v2.6.1 lightweight runtime regression: PASS');")
          s=s.replace("console.log('v2.6.0 lightweight runtime regression: PASS');", "console.log('v2.6.1 lightweight runtime regression: PASS');")
          p.write_text(s)
          PY
      - name: Validate v2.6.1 before commit
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          python -m json.tool manifest.json >/dev/null
          for f in tests/*.test.js; do echo "== $f =="; node "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./manifest.json');
          if(m.version!=='2.6.1') throw new Error('version mismatch');
          const bg=fs.readFileSync('background.js','utf8');
          const content=fs.readFileSync('content.js','utf8');
          const f=fs.readFileSync('followup-background.js','utf8');
          const semantic=fs.readFileSync('semantic.js','utf8');
          if(!bg.includes('resolveRenderedSiteIdentity')||!content.includes('reconcileSiteIdentity')) throw new Error('site identity restore missing');
          if(!f.includes('SAFE_LEAF_RE')||!f.includes('SENSITIVE_KEY_RE')||!f.includes('main-world-safe')) throw new Error('safe projection missing');
          if(f.includes("chrome.tabs.query({ url: ['https://*/*'] })")) throw new Error('broad tab query returned');
          if(!f.includes('apiSessionLikely')) throw new Error('cookie/API gate missing');
          if(!semantic.includes('OfferTrackCompanyIdentity')||!semantic.includes('isAccountUiElement')) throw new Error('semantic union missing');
          console.log('v2.6.1 pre-commit gate PASS');
          NODE
      - name: Commit production source and tests
        run: |
          set -euo pipefail
          rm -rf .sync
          git config user.name 'Zeng, Hualong'
          git config user.email '140960050+Bruce0153@users.noreply.github.com'
          git add -A
          # Never let this GitHub Actions token modify workflow files.
          git reset HEAD .github/workflows/v261-apply.yml .github/workflows/v26-ci.yml || true
          git checkout -- .github/workflows/v261-apply.yml .github/workflows/v26-ci.yml
          git add -A
          git commit -m 'fix(v2.6.1): restore advanced identity and safe follow-up runtime'
          git push origin HEAD:fix/v2.6.1
